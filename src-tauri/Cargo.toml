[package]
name = "sub-stellar"
version = "0.9.1"
description = "SubStellar Next-Gen Animated Subtitle & Lyrics Studio"
authors = ["SayMaven"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "sub_stellar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
regex = "1"
tauri-plugin-window-state = "2"
lindera = { version = "6.2.0", features = ["embed-ipadic"] }
symphonia = { version = "0.5", features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }

