<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 1. Rich Cosmic Midnight Background (Deep Indigo -> Abyssal Navy -> Void) -->
    <radialGradient id="cosmicBg" cx="46%" cy="42%" r="68%" fx="42%" fy="38%">
      <stop offset="0%" stop-color="#1a2456" />
      <stop offset="48%" stop-color="#0d1230" />
      <stop offset="100%" stop-color="#050714" />
    </radialGradient>

    <!-- Dual-Tone Nebula Wash: Cyan-Teal Top-Left & Magenta-Violet Bottom-Right -->
    <radialGradient id="nebulaCyan" cx="24%" cy="22%" r="54%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#2563eb" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#050714" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPink" cx="78%" cy="78%" r="54%">
      <stop offset="0%" stop-color="#ff2a85" stop-opacity="0.24" />
      <stop offset="45%" stop-color="#7b2cbf" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#050714" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Center Backlight -->
    <radialGradient id="ambientCenter" cx="50%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#a5c4ff" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#6d28d9" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Bezel Rim Border: Subtle Cyan -> White -> Pink -->
    <linearGradient id="bezelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff2a85" stop-opacity="0.38" />
    </linearGradient>

    <!-- Top Constellation Ribbon: Electric Cyan -> Azure -> Violet -->
    <linearGradient id="topArcGrad" x1="15%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#22f7dc" />
      <stop offset="52%" stop-color="#4d8bff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Top Ribbon Specular Rim -->
    <linearGradient id="topRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#93c5fd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Constellation Ribbon: Violet -> Berry -> Neon Rose -->
    <linearGradient id="botArcGrad" x1="10%" y1="10%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="48%" stop-color="#d91b86" />
      <stop offset="100%" stop-color="#ff4d94" />
    </linearGradient>

    <!-- Bottom Ribbon Specular Rim -->
    <linearGradient id="botRimGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffd6e8" stop-opacity="0.80" />
      <stop offset="55%" stop-color="#f472b6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Constellation Hairline Gradients -->
    <linearGradient id="constellationLineTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="constellationLineBot" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff5ca8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15" />
    </linearGradient>

    <!-- Celestial Core Star Glow -->
    <radialGradient id="starCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#d8e6ff" stop-opacity="0.85" />
      <stop offset="62%" stop-color="#7c9eff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#7c9eff" stop-opacity="0" />
    </radialGradient>

    <!-- Clip Path for Squircle -->
    <clipPath id="squircleClip">
      <rect x="40" y="40" width="944" height="944" rx="224" ry="224" />
    </clipPath>

    <!-- Clean Crisp Drop Shadow for Foreground Glyphs -->
    <filter id="glyphShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02030a" flood-opacity="0.82" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#02030a" flood-opacity="0.55" />
    </filter>

    <!-- Star Bloom -->
    <filter id="starBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#93c5fd" flood-opacity="0.90" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- 1. Master Squircle Housing with Cosmic Nebula Background -->
  <g clip-path="url(#squircleClip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#cosmicBg)" />
    <rect x="40" y="40" width="944" height="944" fill="url(#nebulaCyan)" />
    <rect x="40" y="40" width="944" height="944" fill="url(#nebulaPink)" />
    <circle cx="512" cy="512" r="390" fill="url(#ambientCenter)" />

    <!-- Subtle Depth Starfield -->
    <circle cx="176" cy="186" r="2.2" fill="#99f6e4" opacity="0.55" />
    <circle cx="248" cy="126" r="1.4" fill="#e0f2fe" opacity="0.45" />
    <circle cx="812" cy="168" r="1.8" fill="#c7d2fe" opacity="0.45" />
    <circle cx="876" cy="272" r="1.3" fill="#e0e7ff" opacity="0.35" />
    <circle cx="144" cy="720" r="1.5" fill="#ddd6fe" opacity="0.38" />
    <circle cx="212" cy="868" r="2.0" fill="#fbcfe8" opacity="0.42" />
    <circle cx="848" cy="812" r="2.2" fill="#f9a8d4" opacity="0.55" />
    <circle cx="776" cy="884" r="1.3" fill="#f5d0fe" opacity="0.40" />

    <!-- Subtle Orbital Constellation Guide Rings -->
    <circle cx="512" cy="512" r="332" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2" stroke-dasharray="10 14" />
  </g>

  <!-- Outer Crisp Glass Bezel -->
  <rect x="40" y="40" width="944" height="944" rx="224" ry="224" fill="none" stroke="url(#bezelBorder)" stroke-width="3.5" />

  <!-- 2. HORIZONTAL 'S' CONSTELLATION (Rotated 90deg -> Pink/Magenta, Left & Right) -->
  <g transform="rotate(90 512 512)" opacity="0.90">
    <g stroke-linecap="round" fill="none">
      <path d="M 332 456 Q 272 326 350 220" stroke="url(#constellationLineBot)" stroke-width="2.5" stroke-dasharray="6 10" />
      <path d="M 692 568 Q 752 698 674 804" stroke="url(#constellationLineBot)" stroke-width="2.5" stroke-dasharray="6 10" />
    </g>
    <g filter="url(#glyphShadow)">
      <path d="M 454 456
               C 374 428, 304 374, 304 292
               C 304 186, 408 124, 534 124
               C 648 124, 728 178, 742 252
               C 748 286, 722 316, 686 312
               C 656 308, 636 284, 620 256
               C 602 222, 572 204, 530 204
               C 454 204, 392 240, 392 296
               C 392 348, 444 382, 504 402
               C 488 424, 470 442, 454 456 Z"
            fill="url(#botArcGrad)" />
      <path d="M 314 292
               C 314 192, 412 134, 534 134
               C 636 134, 708 180, 728 242"
            fill="none" stroke="url(#botRimGrad)" stroke-width="3.5" stroke-linecap="round" />

      <path d="M 570 568
               C 650 596, 720 650, 720 732
               C 720 838, 616 900, 490 900
               C 376 900, 296 846, 282 772
               C 276 738, 302 708, 338 712
               C 368 716, 388 740, 404 768
               C 422 802, 452 820, 494 820
               C 570 820, 632 784, 632 728
               C 632 676, 580 642, 520 622
               C 536 600, 554 582, 570 568 Z"
            fill="url(#botArcGrad)" />
      <path d="M 710 732
               C 710 832, 612 890, 490 890
               C 388 890, 316 844, 296 782"
            fill="none" stroke="url(#botRimGrad)" stroke-width="3.5" stroke-linecap="round" />
    </g>
    <circle cx="332" cy="456" r="9" fill="#ff2a85" opacity="0.28" />
    <circle cx="332" cy="456" r="4.5" fill="#fbcfe8" />
    <circle cx="690" cy="272" r="7.5" fill="#f472b6" opacity="0.35" />
    <circle cx="690" cy="272" r="3.8" fill="#fce7f3" />
    <circle cx="692" cy="568" r="9" fill="#ff2a85" opacity="0.28" />
    <circle cx="692" cy="568" r="4.5" fill="#fbcfe8" />
    <circle cx="334" cy="752" r="7.5" fill="#f472b6" opacity="0.35" />
    <circle cx="334" cy="752" r="3.8" fill="#fce7f3" />
  </g>

  <!-- 3. VERTICAL 'S' CONSTELLATION (Foreground -> Cyan/Blue, Top & Bottom) -->
  <g>
    <g stroke-linecap="round" fill="none">
      <path d="M 332 456 Q 272 326 350 220" stroke="url(#constellationLineTop)" stroke-width="3" stroke-dasharray="6 10" />
      <path d="M 692 568 Q 752 698 674 804" stroke="url(#constellationLineTop)" stroke-width="3" stroke-dasharray="6 10" />
    </g>

    <g filter="url(#glyphShadow)">
      <!-- Top Arc (Sweeping Blue-Cyan Constellation Crescent) -->
      <path d="M 454 456
               C 374 428, 304 374, 304 292
               C 304 186, 408 124, 534 124
               C 648 124, 728 178, 742 252
               C 748 286, 722 316, 686 312
               C 656 308, 636 284, 620 256
               C 602 222, 572 204, 530 204
               C 454 204, 392 240, 392 296
               C 392 348, 444 382, 504 402
               C 488 424, 470 442, 454 456 Z"
            fill="url(#topArcGrad)" />
      <path d="M 314 292
               C 314 192, 412 134, 534 134
               C 636 134, 708 180, 728 242"
            fill="none" stroke="url(#topRimGrad)" stroke-width="4" stroke-linecap="round" />

      <!-- Bottom Arc (Mirrored Sweeping Blue-Cyan Constellation Crescent) -->
      <path d="M 570 568
               C 650 596, 720 650, 720 732
               C 720 838, 616 900, 490 900
               C 376 900, 296 846, 282 772
               C 276 738, 302 708, 338 712
               C 368 716, 388 740, 404 768
               C 422 802, 452 820, 494 820
               C 570 820, 632 784, 632 728
               C 632 676, 580 642, 520 622
               C 536 600, 554 582, 570 568 Z"
            fill="url(#topArcGrad)" />
      <path d="M 710 732
               C 710 832, 612 890, 490 890
               C 388 890, 316 844, 296 782"
            fill="none" stroke="url(#topRimGrad)" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Constellation Star Nodes -->
    <circle cx="332" cy="456" r="10" fill="#22f7dc" opacity="0.28" />
    <circle cx="332" cy="456" r="5" fill="#99f6e4" />
    <circle cx="690" cy="272" r="8" fill="#a78bfa" opacity="0.35" />
    <circle cx="690" cy="272" r="4" fill="#e0e7ff" />

    <circle cx="692" cy="568" r="10" fill="#22f7dc" opacity="0.28" />
    <circle cx="692" cy="568" r="5" fill="#99f6e4" />
    <circle cx="334" cy="752" r="8" fill="#a78bfa" opacity="0.35" />
    <circle cx="334" cy="752" r="4" fill="#e0e7ff" />
  </g>

  <!-- 4. THE NORTH STAR (Focal Sync Playhead at the Exact Center) -->
  <g filter="url(#starBloom)">
    <circle cx="512" cy="512" r="82" fill="url(#starCoreGlow)" />
    <path d="M 512 398
             Q 512 512 552 512
             Q 512 512 512 626
             Q 512 512 472 512
             Q 512 512 512 398 Z"
          fill="#ffffff" />
    <path d="M 398 512
             Q 512 512 512 472
             Q 512 512 626 512
             Q 512 512 512 552
             Q 512 512 398 512 Z"
          fill="#ffffff" />
    <polygon points="512,468 532,512 512,556 492,512" fill="#ffffff" />
    <circle cx="512" cy="512" r="8" fill="#ffffff" />
  </g>
</svg>
